<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('novy.theme.v1');
          var dark = false;
          if (pref === 'dark') dark = true;
          else if (pref === 'light') dark = false;
          else dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <meta name="theme-color" content="#f5f6f8" />
    <meta name="description" content="Novy — a no-code application builder platform." />
    <title>Novy Web</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main/index.tsx"></script>
  </body>
</html>
